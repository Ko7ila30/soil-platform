services:

  # ------------------------------------------------------------------
  # db: PostGIS database
  # ------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: soil_platform_db

    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      # Host port 5433 avoids conflicts with any locally installed Postgres.
      - "5433:5432"

    volumes:
      - soil_db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  # ------------------------------------------------------------------
  # web: Flask application
  # Built from the Dockerfile in this directory.
  # Waits for db to be healthy before starting.
  # ------------------------------------------------------------------
  web:
    build: .
    container_name: soil_platform_web

    environment:
      # DB connection -- must match the db service above.
      # Inside Docker, containers talk to each other by service name ("db"),
      # not "localhost". POSTGRES_PORT is the container-internal port (5432).
      POSTGRES_HOST:     db
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Tell app.py to bind on all interfaces and disable debug mode
      FLASK_HOST:        0.0.0.0
      FLASK_PORT:        5000
      FLASK_ENV:         production

    ports:
      # http://localhost:5000 opens the app in your browser
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy   # waits until PostGIS is ready

    restart: unless-stopped

volumes:
  soil_db_data:
