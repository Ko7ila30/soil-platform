{% extends "base.html" %}
{% block title %}Connexion – SoilWatch{% endblock %}
{% block content %}
<section style="display:flex;justify-content:center;padding:56px 16px;">
  <form method="post" class="card" style="width:min(420px,100%);padding:32px;" novalidate>
    <h1 style="margin-top:0;font-family:'DM Serif Display',serif;">Connexion</h1>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div style="margin-bottom:14px;"><label for="email">Adresse e-mail *</label><input class="form-control" id="email" name="email" type="email" required autocomplete="email" value="{{ email }}"></div>
    <div style="margin-bottom:14px;"><label for="password">Mot de passe *</label><input class="form-control" id="password" name="password" type="password" required minlength="8" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;" type="submit">Se connecter</button>
    <p style="margin-bottom:0;margin-top:18px;font-size:.9rem;">Pas encore de compte ? <a href="/register">Créer un compte</a></p>
  </form>
</section>
{% endblock %}
