<!DOCTYPE html>
<html lang="en" dir="ltr" id="carte-html">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Map — SoilWatch</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

<!-- Leaflet and Geoman served locally — no CDN, no tracking prevention issues -->
<link rel="stylesheet" href="/static/vendor/leaflet.css"/>
<link rel="stylesheet" href="/static/vendor/leaflet-geoman.css"/>

<style>
/* ---- Reset ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --soil-dark:  #2C1A0E;
  --soil-mid:   #8B5E3C;
  --clay:       #C4956A;
  --silt:       #E8D5B0;
  --water:      #3A7CA5;
  --water-dark: #2B5F80;
  --surface:    #F5F0E8;
  --white:      #FFFFFF;
  --ink:        #1A1A1A;
  --muted:      #6B5B4E;
  --border:     #D4B896;
  --danger:     #C0392B;
  --danger-bg:  #FDECEA;
  --success:    #2E7D32;
  --success-bg: #E8F5E9;
  --warning:    #B7791F;
  --warning-bg: #FEFCE8;
  --font-ui:    'Inter', system-ui, sans-serif;
  --font-disp:  'DM Serif Display', Georgia, serif;
  --radius:     8px;
  --radius-sm:  4px;
  --shadow:     0 2px 8px rgba(44,26,14,.12);
  --shadow-sm:  0 1px 3px rgba(44,26,14,.10);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
}

/* ---- Navbar ---- */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: var(--soil-dark);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 1rem;
  gap: 1rem;
  z-index: 2000;
  box-shadow: 0 2px 4px rgba(0,0,0,.2);
}
.navbar-brand {
  display: flex; align-items: center; gap: 8px;
  color: #fff; text-decoration: none;
  font-family: var(--font-disp); font-size: 1.1rem;
}
.navbar-brand svg { width: 26px; height: 26px; }
.navbar-brand:hover { color: var(--silt); }
.nav-links { display: flex; gap: 2px; list-style: none; }
.nav-links a {
  color: rgba(255,255,255,.75); font-size: .88rem; font-weight: 500;
  padding: 6px 10px; border-radius: 4px; text-decoration: none;
  transition: color .15s, background .15s;
}
.nav-links a:hover, .nav-links a.active {
  color: #fff; background: rgba(255,255,255,.12);
}
.nav-spacer { flex: 1; }
.lang-switcher {
  display: flex; gap: 2px;
  background: rgba(0,0,0,.25); border-radius: 4px; padding: 2px;
}
.btn-lang {
  background: transparent; border: none;
  color: rgba(255,255,255,.65); font-size: .75rem; font-weight: 600;
  padding: 3px 8px; border-radius: 3px; cursor: pointer;
  transition: background .15s, color .15s;
}
.btn-lang:hover { color: #fff; background: rgba(255,255,255,.12); }
.btn-lang.active { background: var(--clay); color: var(--soil-dark); }

/* ---- Map fills everything below the navbar ---- */
#map {
  position: fixed;
  top: 56px; left: 0; right: 0; bottom: 0;
  z-index: 0;
}

/* ---- Floating toolbar ---- */
.map-toolbar {
  position: fixed;
  top: 68px; left: 12px;
  z-index: 800;
  display: flex; flex-direction: column; gap: 6px;
}
.map-toolbar-row { display: flex; gap: 6px; }
.toolbar-btn {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 12px;
  font-family: var(--font-ui); font-size: .82rem; font-weight: 500;
  color: var(--soil-dark); cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: background .15s, color .15s;
  white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.toolbar-btn:hover { background: var(--silt); }
.toolbar-btn.active { background: var(--water); color: #fff; border-color: var(--water); }
.toolbar-btn.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

/* ---- Search ---- */
.map-search {
  position: fixed;
  top: 68px;
  left: 50%; transform: translateX(-50%);
  z-index: 800;
  width: 320px;
}
.map-search input {
  width: 100%; padding: 9px 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-family: var(--font-ui); font-size: .9rem;
  background: #fff; box-shadow: var(--shadow-sm);
}
.map-search input:focus {
  outline: none; border-color: var(--water);
  box-shadow: 0 0 0 3px rgba(58,124,165,.18);
}
#search-results {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); margin-top: 4px;
  max-height: 260px; overflow-y: auto;
  box-shadow: var(--shadow);
}
#search-results div {
  padding: 8px 14px; cursor: pointer;
  font-size: .88rem; border-bottom: 1px solid var(--silt);
}
#search-results div:last-child { border-bottom: none; }
#search-results div:hover { background: var(--surface); }
#search-results small { color: var(--muted); margin-left: 6px; }

/* ---- Hint banner ---- */
.hint-banner {
  position: fixed;
  top: 68px; left: 50%; transform: translateX(-50%);
  z-index: 900;
  background: var(--warning-bg); border: 1px solid var(--warning);
  border-radius: var(--radius);
  padding: 8px 16px; font-size: .85rem; font-weight: 500; color: var(--warning);
  display: none; align-items: center; gap: 10px;
  box-shadow: var(--shadow); white-space: nowrap;
}
.hint-banner.visible { display: flex; }
.hint-banner button {
  background: none; border: 1px solid var(--warning);
  border-radius: var(--radius-sm); padding: 2px 10px;
  font-size: .8rem; cursor: pointer; color: var(--warning);
}
.hint-banner button:hover { background: var(--warning); color: #fff; }

/* ---- Legend ---- */
.map-legend {
  position: fixed;
  bottom: 32px; left: 12px;
  z-index: 800;
  background: rgba(255,255,255,.97);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; font-size: .78rem;
  max-width: 220px; max-height: 38vh; overflow-y: auto;
  box-shadow: var(--shadow-sm);
}
.map-legend h4 { font-family: var(--font-ui); font-size: .82rem; font-weight: 600; margin-bottom: 6px; }
.legend-item { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
.legend-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); flex-shrink: 0; }
.legend-swatch { width: 14px; height: 9px; border-radius: 2px; opacity: .55; flex-shrink: 0; }

/* ---- Side panel ---- */
.side-panel {
  position: fixed;
  top: 56px; right: 0; bottom: 0;
  width: 380px;
  background: #fff; color: var(--ink);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden; z-index: 500;
  transform: translateX(100%);
  transition: transform .25s ease;
  box-shadow: -4px 0 16px rgba(0,0,0,.12);
}
.side-panel.open { transform: translateX(0); }

.panel-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--silt);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  background: var(--silt); flex-shrink: 0;
}
.panel-header h3 { font-size: 1.05rem; color: var(--soil-dark); margin: 0 0 2px; }
.panel-header .panel-sub { color: var(--muted); font-size: .82rem; }
.panel-close {
  background: none; border: none; font-size: 1.1rem;
  cursor: pointer; color: var(--muted); flex-shrink: 0;
  padding: 2px 4px; border-radius: var(--radius-sm);
}
.panel-close:hover { color: var(--ink); }

.panel-body { flex: 1; overflow-y: auto; padding: 14px 18px; }

.attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 16px; }
.attr-item dt { font-size: .73rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.attr-item dd { font-weight: 600; font-size: .88rem; word-break: break-word; margin: 0; }

.panel-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--silt); }

.obs-section h4 { font-size: .88rem; font-weight: 600; color: var(--soil-dark); margin-bottom: 10px; }
.obs-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.obs-card-header { display: flex; justify-content: space-between; font-size: .8rem; margin-bottom: 6px; }
.obs-card-header strong { color: var(--soil-dark); }
.obs-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
.obs-meta { font-size: .78rem; color: var(--muted); margin-top: 4px; }

/* ---- Edit form in panel ---- */
.edit-form { display: none; background: #f9f5ef; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
.edit-form.visible { display: block; }
.edit-form h4 { font-size: .9rem; margin-bottom: 10px; color: var(--soil-dark); }
.edit-form .fg { margin-bottom: 8px; }
.edit-form label { display: block; font-size: .78rem; font-weight: 500; margin-bottom: 3px; color: var(--muted); }
.edit-form input, .edit-form select, .edit-form textarea {
  width: 100%; padding: 5px 8px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: var(--font-ui); font-size: .84rem;
}
.edit-form input:focus, .edit-form select:focus { outline: none; border-color: var(--water); }
.field-error { display: block; font-size: .78rem; color: var(--danger); margin-top: 2px; }

/* ---- Floating add/draw forms ---- */
.float-form {
  position: fixed;
  bottom: 0; right: 0;
  width: 310px;
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius) 0 0 0;
  padding: 16px; z-index: 850;
  box-shadow: var(--shadow); max-height: 72vh; overflow-y: auto;
  display: none;
}
.float-form.visible { display: block; }
.float-form h3 { font-size: .95rem; color: var(--soil-dark); margin-bottom: 12px; }
.form-group { margin-bottom: 10px; }
.form-group label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: 3px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 6px 8px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: var(--font-ui); font-size: .85rem;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--water); }
.required { color: var(--danger); }
.form-actions { display: flex; gap: 8px; margin-top: 10px; }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-ui); font-size: .875rem; font-weight: 500;
  padding: .45rem 1rem; border: none; border-radius: var(--radius);
  cursor: pointer; text-decoration: none; transition: background .15s;
  white-space: nowrap;
}
.btn-primary { background: var(--water); color: #fff; }
.btn-primary:hover { background: var(--water-dark); }
.btn-secondary { background: var(--silt); color: var(--soil-dark); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #a93226; }
.btn-ghost { background: transparent; color: var(--water); border: 1px solid var(--water); }
.btn-ghost:hover { background: #ebf4fa; }
.btn-sm { font-size: .78rem; padding: .28rem .65rem; }

/* ---- Badges ---- */
.badge { display: inline-block; font-size: .73rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.badge-absente, .badge-aucune   { background: #e8f5e9; color: #2e7d32; }
.badge-traces, .badge-en-nappe  { background: #fefce8; color: #b7791f; }
.badge-crouts, .badge-rigoles, .badge-ravines { background: #fdecea; color: #c0392b; }
.badge-water, .badge-irrigation { background: #ebf4fa; color: #2b5f80; }

/* ---- Modals ---- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(44,26,14,.5);
  z-index: 3000;
  display: none; align-items: center; justify-content: center;
}
.modal-overlay:not([hidden]) { display: flex; }
.modal-box {
  background: #fff; border-radius: var(--radius);
  width: min(560px, 95vw); max-height: 90vh; overflow-y: auto;
  padding: 20px 24px; box-shadow: 0 8px 32px rgba(0,0,0,.2);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--silt);
}
.modal-header h2 { font-size: 1.1rem; color: var(--soil-dark); font-family: var(--font-disp); }
.btn-close-modal { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--muted); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---- Toast ---- */
.toast-container {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 4000; display: flex; flex-direction: column; gap: 8px; align-items: center;
}
.toast {
  background: var(--soil-dark); color: #fff;
  padding: 8px 20px; border-radius: var(--radius);
  font-size: .88rem; font-weight: 500;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  transition: opacity .3s; max-width: 400px; text-align: center;
}
.toast.toast-success { background: var(--success); }
.toast.toast-error   { background: var(--danger); }
.toast.toast-fade    { opacity: 0; }
</style>
</head>
<body>

<!-- Navbar — matches home/tables design -->
<nav class="navbar">
  <a href="/home" class="navbar-brand">
    <svg viewBox="0 0 28 28" fill="none">
      <rect x="2" y="4"  width="24" height="6" rx="2" fill="#E8D5B0"/>
      <rect x="2" y="11" width="24" height="6" rx="2" fill="#C4956A"/>
      <rect x="2" y="18" width="24" height="6" rx="2" fill="#8B5E3C"/>
      <line x1="2" y1="4" x2="26" y2="4" stroke="#3A7CA5" stroke-width="2" stroke-linecap="round"/>
    </svg>
    SoilWatch
  </a>
  <ul class="nav-links">
    <li><a href="/home">Home</a></li>
    <li><a href="/carte" class="active">Map</a></li>
    <li><a href="/tables">Tables</a></li>
  </ul>
  <div class="nav-spacer"></div>
  <a href="/login" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4);">Login</a>
  <div class="lang-switcher">
    <button class="btn-lang active" onclick="setLang('en')">EN</button>
    <button class="btn-lang" onclick="setLang('fr')">FR</button>
    <button class="btn-lang" onclick="setLang('ar')">AR</button>
  </div>
</nav>

<!-- Map — position:fixed top:56px fills everything below the navbar -->
<div id="map"></div>

<!-- Toolbar -->
<div class="map-toolbar">
  <div class="map-toolbar-row">
    <button class="toolbar-btn" id="btn-add-site">+ Add Site</button>
    <button class="toolbar-btn" id="btn-draw-zone">&#9671; Draw Zone</button>
  </div>
  <div class="map-toolbar-row">
    <button class="toolbar-btn" id="btn-edit-geom">&#9998; Edit Geometry</button>
    <button class="toolbar-btn danger" id="btn-delete">&#128465; Delete</button>
  </div>
</div>

<!-- Search -->
<div class="map-search">
  <input type="search" id="q" placeholder="Search a site or zone..." autocomplete="off"/>
  <div id="search-results"></div>
</div>

<!-- Hint banner -->
<div class="hint-banner" id="hint-banner">
  <span id="hint-text"></span>
  <button id="btn-cancel-mode">Cancel</button>
</div>

<!-- Legend -->
<div class="map-legend" id="map-legend">
  <h4>Legend</h4>
  <div id="legend-content">Loading...</div>
</div>

<!-- Side panel -->
<aside class="side-panel" id="side-panel">
  <div class="panel-header">
    <div>
      <h3 id="panel-title">—</h3>
      <div class="panel-sub" id="panel-sub"></div>
    </div>
    <button class="panel-close" id="panel-close">&#x2715;</button>
  </div>
  <div class="panel-body">
    <div id="panel-attrs"></div>
    <div class="panel-actions" id="panel-actions"></div>
    <div class="edit-form" id="edit-form">
      <h4>Edit attributes</h4>
      <div id="edit-fields"></div>
      <div class="form-actions" style="margin-top:10px;">
        <button class="btn btn-primary btn-sm" id="btn-save-edit">Save</button>
        <button class="btn btn-secondary btn-sm" id="btn-cancel-edit">Cancel</button>
      </div>
      <div id="edit-errors" style="margin-top:6px;"></div>
    </div>
    <div class="obs-section" id="obs-section"></div>
  </div>
</aside>

<!-- Add-site form -->
<div class="float-form" id="add-site-form-wrap">
  <h3>New observation site</h3>
  <form id="add-site-form" novalidate>
    <div class="form-group"><label>Site name <span class="required">*</span></label>
      <input type="text" name="name" maxlength="100"/>
      <span class="field-error" id="err-add-name"></span></div>
    <div class="form-group"><label>Crop <span class="required">*</span></label>
      <select name="culture" id="add-culture-sel"><option value="">— Choose —</option></select>
      <span class="field-error" id="err-add-culture"></span></div>
    <div class="form-group"><label>Soil type <span class="required">*</span></label>
      <select name="soil_type" id="add-soiltype-sel"><option value="">— Choose —</option></select>
      <span class="field-error" id="err-add-soil_type"></span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="form-group"><label style="font-size:.75rem;">Latitude</label>
        <input type="text" id="add-lat" readonly/></div>
      <div class="form-group"><label style="font-size:.75rem;">Longitude</label>
        <input type="text" id="add-lon" readonly/></div>
    </div>
    <span class="field-error" id="err-add-coords"></span>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-add-site">Cancel</button>
    </div>
  </form>
</div>

<!-- Draw-zone form -->
<div class="float-form" id="draw-zone-form-wrap">
  <h3>New soil zone</h3>
  <form id="draw-zone-form" novalidate>
    <div class="form-group"><label>Zone name <span class="required">*</span></label>
      <input type="text" name="name" maxlength="100"/>
      <span class="field-error" id="err-zone-name"></span></div>
    <div class="form-group"><label>Zone type</label>
      <input type="text" name="zone_type" value="unité de sol" maxlength="80"/></div>
    <div class="form-group"><label>Description</label>
      <textarea name="description" rows="2" maxlength="400"></textarea></div>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:8px;">Draw the polygon on the map first.</p>
    <span class="field-error" id="err-zone-geom"></span>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-draw-zone">Cancel</button>
    </div>
  </form>
</div>

<!-- Observation modal -->
<div id="obs-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <h2>Add Observation</h2>
      <button class="btn-close-modal" id="btn-close-obs-modal">&#x2715;</button>
    </div>
    <form id="obs-modal-form" novalidate>
      <input type="hidden" id="obs-site-id-hidden"/>
      <div class="form-group"><label>Contributor name <span class="required">*</span></label>
        <input type="text" name="contributor_name" maxlength="100"/>
        <span class="field-error" id="err-obs-contributor_name"></span></div>
      <div class="form-group"><label>Observation date <span class="required">*</span></label>
        <input type="date" name="observation_date"/>
        <span class="field-error" id="err-obs-observation_date"></span></div>
      <div class="form-row">
        <div class="form-group"><label>Soil texture <span class="required">*</span></label>
          <select name="soil_texture" id="obs-texture-sel"><option value="">— Choose —</option></select>
          <span class="field-error" id="err-obs-soil_texture"></span></div>
        <div class="form-group"><label>Water status <span class="required">*</span></label>
          <select name="water_status" id="obs-water-sel"><option value="">— Choose —</option></select>
          <span class="field-error" id="err-obs-water_status"></span></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Salinity <span class="required">*</span></label>
          <select name="salinity" id="obs-salinity-sel"><option value="">— Choose —</option></select>
          <span class="field-error" id="err-obs-salinity"></span></div>
        <div class="form-group"><label>Erosion <span class="required">*</span></label>
          <select name="erosion" id="obs-erosion-sel"><option value="">— Choose —</option></select>
          <span class="field-error" id="err-obs-erosion"></span></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Crop <span class="required">*</span></label>
          <select name="culture" id="obs-culture-sel"><option value="">— Choose —</option></select>
          <span class="field-error" id="err-obs-culture"></span></div>
        <div class="form-group"><label>Irrigation <span class="required">*</span></label>
          <select name="irrigation_mode" id="obs-irrigation-sel"><option value="">— Choose —</option></select>
          <span class="field-error" id="err-obs-irrigation_mode"></span></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>pH (0–14)</label>
          <input type="number" name="ph" min="0" max="14" step="0.1"/>
          <span class="field-error" id="err-obs-ph"></span></div>
        <div class="form-group"><label>EC dS/m</label>
          <input type="number" name="ec_dsm" min="0" step="0.01"/>
          <span class="field-error" id="err-obs-ec_dsm"></span></div>
      </div>
      <div class="form-group"><label>Organic matter %</label>
        <input type="number" name="organic_matter_pct" min="0" max="100" step="0.1"/>
        <span class="field-error" id="err-obs-organic_matter_pct"></span></div>
      <div class="form-group"><label>Remark</label>
        <textarea name="remark" rows="2" maxlength="1000"></textarea></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save observation</button>
        <button type="button" class="btn btn-secondary" id="btn-cancel-obs-modal">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirmation modal -->
<div id="delete-modal" class="modal-overlay" hidden>
  <div class="modal-box" style="max-width:400px;">
    <div class="modal-header">
      <h2>Confirm deletion</h2>
      <button class="btn-close-modal" id="btn-close-delete-modal">&#x2715;</button>
    </div>
    <p id="delete-modal-msg" style="color:var(--muted);margin-bottom:16px;"></p>
    <div class="form-actions">
      <button class="btn btn-danger" id="btn-confirm-delete">Delete</button>
      <button class="btn btn-secondary" id="btn-cancel-delete">Cancel</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container" aria-live="polite"></div>

<!-- Language switching (server-side cookie, same as base.html) -->
<script>
function setLang(code) {
  document.cookie = "lang=" + code + "; path=/; max-age=31536000; SameSite=Lax";
  location.reload();
}

// Highlight the active lang button on load
(function() {
  var lang = "{{ lang|default('en') }}";
  document.querySelectorAll('.btn-lang').forEach(function(b) {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === lang);
  });
  if (lang === 'ar') {
    document.getElementById('carte-html').setAttribute('dir', 'rtl');
    document.getElementById('carte-html').setAttribute('lang', 'ar');
  }
})();

function showToast(message, type, duration) {
  if (!duration) { duration = 3000; }
  var c  = document.getElementById('toast-container');
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' toast-' + type : '');
  el.textContent = message;
  c.appendChild(el);
  setTimeout(function() {
    el.classList.add('toast-fade');
    setTimeout(function() { if (el.parentNode) c.removeChild(el); }, 300);
  }, duration);
}
</script>
